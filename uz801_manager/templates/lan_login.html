<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenStick — Đăng nhập</title><link rel="stylesheet" href="/static/portal.css"></head><body><main style="max-width:420px!important;padding-top:12vh!important"><h1>OpenStick</h1><p class="muted">Quản trị UZ801 qua Wi-Fi nội bộ</p><section>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form action="/login" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">Mật khẩu quản trị</label><input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password" style="width:100%;padding:12px;margin:12px 0"><button type="submit">Đăng nhập</button></form><p><small>Mật khẩu được đặt tại Wi-Fi &amp; Web khi kết nối quản trị qua USB.</small></p></section></main></body></html>
