<section><h2>Quản trị từ điện thoại qua Wi-Fi</h2><p id="lan-status" role="status">Đang kiểm tra…</p><p id="lan-url"></p><form id="lan-settings"><label for="lan-password">Đặt mật khẩu quản trị (12–128 ký tự)</label><input id="lan-password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label for="lan-password-repeat">Nhập lại mật khẩu</label><input id="lan-password-repeat" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><p><button>Bật / đổi mật khẩu quản trị Wi-Fi</button><button id="lan-disable" type="button" class="secondary" hidden>Tắt truy cập qua Wi-Fi</button></p></form><p><small>Chỉ mở trong Wi-Fi đang kết nối. Trang quản trị yêu cầu đăng nhập; website và Cloudflare Tunnel không đổi. Điện thoại cần ở cùng mạng và mạng không bật cách ly thiết bị khách.</small></p></section>
<script>
async function lanCall(action,extra={}){const r=await fetch('/api/lan',{method:'POST',headers:{'Content-Type':'application/json','X-OpenStick-Token':token},body:JSON.stringify({action,...extra})});if(!r.ok)throw Error();return r.json()}
async function lanStatus(){try{const s=await lanCall('status');document.getElementById('lan-status').textContent=s.enabled?'Đã bật quản trị qua Wi-Fi — yêu cầu đăng nhập.':'Chưa bật. Đặt mật khẩu để mở quản trị qua Wi-Fi.';const box=document.getElementById('lan-url');box.replaceChildren();if(s.stable_url){const link=document.createElement('a');link.href=s.stable_url;link.textContent=s.stable_url;box.append('Địa chỉ cố định PC / điện thoại: ',link,document.createElement('br'))}if(s.url){const link=document.createElement('a');link.href=s.url;link.textContent=s.url;box.append('IP Wi-Fi hiện tại (dự phòng): ',link)}else box.append('Chưa có địa chỉ Wi-Fi. Kết nối Wi-Fi trước.');document.getElementById('lan-disable').hidden=!s.enabled}catch(e){document.getElementById('lan-status').textContent='Chưa kiểm tra được cấu hình LAN.'}}
document.getElementById('lan-settings').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('lan-password'),again=document.getElementById('lan-password-repeat');if(p.value!==again.value){document.getElementById('lan-status').textContent='Hai mật khẩu chưa trùng nhau.';return}try{document.getElementById('lan-status').textContent='Đang lưu cấu hình…';await lanCall('configure',{password:p.value,confirm:true});p.value='';again.value='';await lanStatus()}catch(error){document.getElementById('lan-status').textContent='Chưa lưu được cấu hình. Kiểm tra mật khẩu rồi thử lại.'}};
document.getElementById('lan-disable').onclick=async()=>{if(!confirm('Tắt truy cập quản trị qua Wi-Fi? Quản trị qua USB vẫn hoạt động.'))return;try{await lanCall('disable',{confirm:true});await lanStatus()}catch(e){document.getElementById('lan-status').textContent='Chưa tắt được truy cập LAN.'}};window.addEventListener('DOMContentLoaded',lanStatus,{once:true});
</script>
