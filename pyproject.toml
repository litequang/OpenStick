[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uz801-openstick-manager"
version = "0.1.0"
description = "Read-only local Windows backup manager for UZ801"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1.3,<4", "waitress>=3.0.2,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.22,<7"]

[project.scripts]
uz801-manager = "uz801_manager.__main__:main"

[tool.setuptools.packages.find]
include = ["uz801_manager*"]

[tool.setuptools.package-data]
uz801_manager = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
