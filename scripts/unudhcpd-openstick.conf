# Append to /etc/unudhcpd.conf after preserving the original file.
# The upstream dispatcher sources this supported configuration hook.
# Keep its management DHCP default unless the owner explicitly saved sharing.
# OPENSTICK_USB_TETHER_BOOT_V1
if /usr/bin/python3 -c 'import json; v=json.load(open("/var/lib/openstick/usb-tethering-intent.json")); raise SystemExit(0 if v.get("version")==2 and v.get("desired") is True else 1)' 2>/dev/null; then
    disable_dhcpd=true
    # If our service cannot start, retain upstream management DHCP as fallback.
    if ! /sbin/rc-service openstick-usb-dhcp start >/dev/null 2>&1; then
        disable_dhcpd=false
    fi
fi
