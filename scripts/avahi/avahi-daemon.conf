# Stable administration name on both the physical USB link and local Wi-Fi.
# The LAN HTTP listener is IPv4-only and remains authenticated on port 8765.
[server]
host-name=openstick
host-name-from-machine-id=no
domain-name=local
allow-interfaces=usb0,wlan0
use-ipv4=yes
use-ipv6=no
enable-dbus=yes
ratelimit-interval-usec=1000000
ratelimit-burst=100

[wide-area]
enable-wide-area=no

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no
publish-resolv-conf-dns-servers=no
publish-aaaa-on-ipv4=no
disable-user-service-publishing=yes

[reflector]
enable-reflector=no
