[global]
pid = /run/openstick-filegator/php.pid
error_log = /var/lib/openstick-filegator/php-error.log
daemonize = no

[openstick-files]
user = openstick-files
group = openstick-files
listen = /run/openstick-filegator/php.sock
listen.owner = openstick-files
listen.group = openstick-files
listen.mode = 0600
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
pm.max_requests = 100
request_terminate_timeout = 120s
clear_env = yes
security.limit_extensions = .php
php_admin_value[memory_limit] = 96M
php_admin_value[upload_max_filesize] = 2M
php_admin_value[post_max_size] = 3M
php_admin_value[max_execution_time] = 110
php_admin_value[max_input_time] = 110
php_admin_value[upload_tmp_dir] = /var/lib/openstick-filegator/uploads
php_admin_value[sys_temp_dir] = /var/lib/openstick-filegator/uploads
php_admin_value[display_errors] = Off
php_admin_value[log_errors] = On
php_admin_value[error_log] = /var/lib/openstick-filegator/php-error.log
php_admin_value[expose_php] = Off
php_admin_value[disable_functions] = exec,system,passthru,shell_exec,proc_open,popen,pcntl_exec
