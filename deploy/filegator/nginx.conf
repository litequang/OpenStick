user openstick-files;
worker_processes 1;
pid /run/openstick-filegator/http.pid;
error_log /var/lib/openstick-filegator/http-error.log warn;
events { worker_connections 32; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /var/lib/openstick-filegator/nginx;
    fastcgi_temp_path /var/lib/openstick-filegator/fastcgi;
    client_max_body_size 2m;
    client_body_buffer_size 64k;
    fastcgi_read_timeout 120s;
    server {
        listen 127.0.0.1:8788;
        server_name localhost;
        root /opt/openstick-filegator/dist;
        location / { try_files /__no_such_filegator_path__ /index.php$is_args$args; }
        location ~ ^/(css|js|fonts|img)/[A-Za-z0-9_./-]+$ { try_files $uri =404; }
        location = /index.php {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /opt/openstick-filegator/dist/index.php;
            fastcgi_pass unix:/run/openstick-filegator/php.sock;
        }
    }
}
